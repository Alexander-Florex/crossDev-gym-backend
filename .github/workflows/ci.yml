name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crossdev
          POSTGRES_PASSWORD: crossdev
          POSTGRES_DB: crossdev_gym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crossdev -d crossdev_gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://crossdev:crossdev@localhost:5432/crossdev_gym
      TEST_DATABASE_URL: postgresql+asyncpg://crossdev:crossdev@localhost:5432/crossdev_gym_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Create test database
        run: |
          PGPASSWORD=crossdev psql -h localhost -U crossdev -d crossdev_gym \
            -c "CREATE DATABASE crossdev_gym_test;"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
