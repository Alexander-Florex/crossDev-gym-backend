services:
  postgres:
    image: postgres:16
    container_name: crossdev-gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crossdev
      POSTGRES_PASSWORD: crossdev
      POSTGRES_DB: crossdev_gym
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossdev -d crossdev_gym"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: crossdev-gym-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
